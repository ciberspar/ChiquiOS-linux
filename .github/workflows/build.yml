
name: ChiquiOS Alpine Experimental

on:
  workflow_dispatch:
  push:
    branches:
      - alpine-experimental
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  alpine-x86:
    name: Alpine Linux x86 (32 bits)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y curl python3

      - name: Encontrar ISO oficial de Alpine
        id: alpine
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import re
          import urllib.request

          base = (
              "https://dl-cdn.alpinelinux.org/"
              "alpine/latest-stable/releases/x86/"
          )

          with urllib.request.urlopen(base, timeout=30) as response:
              html = response.read().decode()

          files = re.findall(
              r'href="(alpine-standard-([0-9.]+)-x86\.iso)"',
              html
          )

          if not files:
              raise SystemExit("No se encontró la ISO oficial x86")

          def version_key(item):
              return tuple(int(x) for x in item[1].split("."))

          filename, version = max(files, key=version_key)

          print("ISO:", filename)
          print("Version:", version)

          with open("/tmp/alpine-url", "w") as f:
              f.write(base + filename)

          with open("/tmp/alpine-version", "w") as f:
              f.write(version)
          PY

          echo "url=$(cat /tmp/alpine-url)" >> "$GITHUB_OUTPUT"
          echo "version=$(cat /tmp/alpine-version)" >> "$GITHUB_OUTPUT"

      - name: Descargar Alpine oficial
        run: |
          set -euo pipefail
          mkdir -p output

          curl -fL --retry 3 \
            "${{ steps.alpine.outputs.url }}" \
            -o output/chiquios-alpine-x86.iso

          test -s output/chiquios-alpine-x86.iso

      - name: Verificar formato ISO
        run: |
          set -euo pipefail

          file output/chiquios-alpine-x86.iso

          python3 - <<'PY'
          from pathlib import Path

          p = Path("output/chiquios-alpine-x86.iso")
          with p.open("rb") as f:
              f.seek(32769)
              signature = f.read(5)

          if signature != b"CD001":
              raise SystemExit("La imagen no parece una ISO válida")

          print("ISO verificada:", p.stat().st_size, "bytes")
          PY

      - name: Publicar ISO de prueba
        uses: actions/upload-artifact@v4
        with:
          name: chiquios-alpine-x86
          path: output/chiquios-alpine-x86.iso
          if-no-files-found: error
          retention-days: 7
