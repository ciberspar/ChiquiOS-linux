
name: Build ChiquiOS Alpine

on:
  workflow_dispatch:
  push:
    branches:
      - alpine-experimental
    paths:
      - ".github/workflows/build.yml"
      - "config/chiquios/**"

permissions:
  contents: read

jobs:
  build:
    name: Build ChiquiOS x86
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Crear ISO personalizada
        run: |
          set -eu
          mkdir -p output

          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/work" \
            alpine:3.24 \
            sh -euxc '
              apk add --no-cache \
                alpine-conf \
                abuild \
                git \
                syslinux \
                xorriso \
                squashfs-tools \
                grub \
                mtools \
                fakeroot


              git clone --depth=1 \
                --branch 3.24-stable \
                https://gitlab.alpinelinux.org/alpine/aports.git \
                /tmp/aports

              cat > /tmp/aports/scripts/mkimg.chiquios.sh <<'"'"'PROFILE'"'"'
          profile_chiquios() {
              profile_standard

              hostname="chiquios"

              apks="$apks nano"

              apkovl="scripts/genapkovl-chiquios.sh"
          }
          PROFILE

              cat > /tmp/aports/scripts/genapkovl-chiquios.sh <<'"'"'OVERLAY'"'"'
          #!/bin/sh
          set -eu

          tmp="$2"

          mkdir -p "$tmp/etc/profile.d"

          cat > "$tmp/etc/hostname" <<'"'"'HOSTNAME'
          chiquios
          HOSTNAME

          cat > "$tmp/etc/motd" <<'"'"'MOTD'
          =================================
                 Bienvenido a ChiquiOS
                 Basado en Alpine Linux
          =================================
          Sistema ligero. Hecho por ti.
          MOTD

          cat > "$tmp/etc/issue" <<'"'"'ISSUE'
          ChiquiOS - Alpine Linux
          ISSUE

          cat > "$tmp/etc/profile.d/chiquios.sh" <<'"'"'PROFILE'
          export CHIQUIOS_EDITION="CLI"
          export CHIQUIOS_BASE="Alpine Linux"

          chiquios-info() {
              echo "ChiquiOS - Alpine Linux"
              uname -a
          }
          PROFILE
          OVERLAY

              chmod +x \
                /tmp/aports/scripts/genapkovl-chiquios.sh

              cd /tmp/aports

              sh scripts/mkimage.sh \
                --tag v3.24.2 \
                --outdir /work/output \
                --workdir /tmp/mkimage \
                --arch x86 \
                --profile chiquios \
                --repository \
                https://dl-cdn.alpinelinux.org/alpine/v3.24/main

              iso="$(find /work/output -maxdepth 1 \
                -type f -name "*.iso" -print -quit)"

              test -n "$iso"
              test -s "$iso"

              cp "$iso" /work/output/chiquios-alpine-x86.iso

              cd /work/output
              sha256sum chiquios-alpine-x86.iso \
                > chiquios-alpine-x86.iso.sha256
            '

      - name: Comprobar ISO generada
        run: |
          set -eu
          test -s output/chiquios-alpine-x86.iso
          test -s output/chiquios-alpine-x86.iso.sha256
          cat output/chiquios-alpine-x86.iso.sha256
          ls -lh output/

      - name: Publicar ChiquiOS
        uses: actions/upload-artifact@v4
        with:
          name: chiquios-alpine-x86
          path: |
            output/chiquios-alpine-x86.iso
            output/chiquios-alpine-x86.iso.sha256
          if-no-files-found: error
          retention-days: 7
