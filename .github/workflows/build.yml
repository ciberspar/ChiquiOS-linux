
name: Build ChiquiOS Linux

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm make binutils

      - name: Compilar bootloader
        run: make


      - name: Verificar segunda etapa
        run: |
          test -s build/boot.bin
          test -s build/stage2.bin
          test "$(stat -c%s build/boot.bin)" -eq 512

          dd if=build/chiquios-test.img \
            of=build/stage2-from-image.bin \
            bs=512 skip=1 count=1 status=none

          cmp build/stage2.bin \
            <(head -c "$(stat -c%s build/stage2.bin)" \
            build/stage2-from-image.bin)

          echo "Primera y segunda etapa verificadas."

      - name: Guardar imagen
        uses: actions/upload-artifact@v4
        with:
          name: chiquios-linux-test
          path: build/chiquios-test.img
          if-no-files-found: error
